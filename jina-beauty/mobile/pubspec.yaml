name: jina_beauty
description: Jina Beauty & Perfumes Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.1
  dio: 5.4.0
  easy_localization: 3.0.3
  cached_network_image: 3.3.1
  shared_preferences: 2.2.2
  url_launcher: 6.2.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
